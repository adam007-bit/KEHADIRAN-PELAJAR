<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Portal Guru & Analitik | Attend-X</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #f1f5f9; font-family: 'Inter', sans-serif; }
        .login-box { max-width: 400px; margin: 80px auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .nav-tabs .nav-link { color: #64748b; font-weight: 600; border: none; }
        .nav-tabs .nav-link.active { color: #4f46e5; border-bottom: 3px solid #4f46e5; background: none; }
        .stat-card { border-radius: 15px; border: none; transition: 0.3s; }
        .stat-card:hover { transform: translateY(-5px); }
        @media print { 
            .no-print, .nav-tabs, .btn, .login-box { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; }
            .card { box-shadow: none; border: 1px solid #ddd; }
        }
    </style>
</head>
<body>

    <div id="authArea" class="login-box">
        <i class="fas fa-university fa-3x text-primary mb-3"></i>
        <h4 class="fw-bold">PORTAL GURU & ANALITIK</h4>
        <input type="password" id="passInput" class="form-control text-center mb-3" maxlength="4" placeholder="PIN 4-Digit">
        <button onclick="checkPass()" class="btn btn-primary w-100 fw-bold">MASUK SISTEM</button>
    </div>

    <div id="dashArea" class="container-fluid py-4" style="display:none;">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4 no-print">
                <h2 class="fw-bold"><i class="fas fa-chart-pie me-2 text-primary"></i>Attend-X Analytics</h2>
                <button onclick="window.print()" class="btn btn-dark shadow-sm"><i class="fas fa-print me-2"></i>Cetak Laporan</button>
            </div>

            <ul class="nav nav-tabs mb-4 no-print" id="myTab" role="tablist">
                <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#analitik">Ringkasan & Peratus</button></li>
                <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#kehadiran">Kehadiran Kelas</button></li>
            </ul>

            <div class="tab-content">
                <div class="tab-pane fade show active" id="analitik">
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <div class="card stat-card bg-primary text-white p-4">
                                <small>OVERALL KEHADIRAN</small>
                                <h1 id="overall-per" class="fw-bold">0%</h1>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card stat-card bg-success text-white p-4">
                                <small>MURID HADIR</small>
                                <h1 id="total-present" class="fw-bold">0</h1>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card stat-card bg-danger text-white p-4">
                                <small>MURID PONTENG</small>
                                <h1 id="total-absent" class="fw-bold">0</h1>
                            </div>
                        </div>
                    </div>

                    <div class="card p-4 card-table">
                        <h5 class="fw-bold mb-3">Analisis Mengikut Tingkatan & Kelas</h5>
                        <div class="table-responsive">
                            <table class="table table-bordered align-middle">
                                <thead class="table-light">
                                    <tr><th>Tingkatan / Kelas</th><th>Enrolmen</th><th>Hadir</th><th>% Kehadiran</th></tr>
                                </thead>
                                <tbody id="statsBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="tab-pane fade" id="kehadiran">
                    <div class="row mb-3 no-print">
                        <div class="col-md-4">
                            <select id="classSelector" class="form-select shadow-sm" onchange="loadClassTable()">
                                <option value="">-- Pilih Kelas --</option>
                                <option value="1 IBNU SINA">1 IBNU SINA</option>
                                <option value="1 KARISMA">1 KARISMA</option>
                                <option value="1 SIMFONI">1 SIMFONI</option>
                            </select>
                        </div>
                    </div>
                    <div class="card p-4 card-table">
                        <table class="table table-hover">
                            <thead><tr><th>Nama</th><th>Status</th><th>Masa</th><th>Catatan</th></tr></thead>
                            <tbody id="classTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
    firebase.initializeApp({ databaseURL: "https://kehadiran-47efc-default-rtdb.asia-southeast1.firebasedatabase.app" });
    const db = firebase.database();
    const MASTER_PASSCODE = "1234";

    function checkPass() {
        if(document.getElementById('passInput').value === MASTER_PASSCODE) {
            document.getElementById('authArea').style.display = 'none';
            document.getElementById('dashArea').style.display = 'block';
            runAnalytics();
        } else { Swal.fire('Salah', 'PIN Tidak Sah', 'error'); }
    }

    async function runAnalytics() {
        const today = new Date().toISOString().split('T')[0];
        const studentsSnap = await db.ref('pelajar').once('value');
        const attendanceSnap = await db.ref(`kehadiran/${today}`).once('value');
        
        const allStudents = studentsSnap.val() || {};
        const attendance = attendanceSnap.val() || {};

        let stats = {}; // { "1 IBNU SINA": {total: 0, present: 0} }
        let grandTotal = 0;
        let grandPresent = 0;

        Object.keys(allStudents).forEach(id => {
            const cls = allStudents[id].class;
            if(!stats[cls]) stats[cls] = { total: 0, present: 0 };
            
            stats[cls].total++;
            grandTotal++;

            if(attendance[id] && (attendance[id].status === "HADIR" || attendance[id].status === "LEWAT")) {
                stats[cls].present++;
                grandPresent++;
            }
        });

        // Papar Stats Table
        let rows = "";
        for(let cls in stats) {
            let per = ((stats[cls].present / stats[cls].total) * 100).toFixed(1);
            rows += `<tr>
                <td class="fw-bold">${cls}</td>
                <td>${stats[cls].total}</td>
                <td>${stats[cls].present}</td>
                <td>
                    <div class="progress" style="height: 20px;">
                        <div class="progress-bar" style="width: ${per}%">${per}%</div>
                    </div>
                </td>
            </tr>`;
        }
        document.getElementById('statsBody').innerHTML = rows;
        document.getElementById('overall-per').innerText = ((grandPresent/grandTotal)*100).toFixed(1) + "%";
        document.getElementById('total-present').innerText = grandPresent;
        document.getElementById('total-absent').innerText = grandTotal - grandPresent;
    }

    async function loadClassTable() {
        const cls = document.getElementById('classSelector').value;
        const today = new Date().toISOString().split('T')[0];
        const studentsSnap = await db.ref('pelajar').orderByChild('class').equalTo(cls).once('value');
        const attendSnap = await db.ref(`kehadiran/${today}`).once('value');
        
        const students = studentsSnap.val() || {};
        const attend = attendSnap.val() || {};
        let html = "";

        Object.keys(students).forEach(id => {
            const s = students[id];
            const rec = attend[id];
            html += `<tr>
                <td>${s.name}</td>
                <td><span class="badge ${!rec?'bg-danger':'bg-success'}">${!rec?'TAK HADIR':'HADIR'}</span></td>
                <td>${rec ? rec.time : '-'}</td>
                <td>${rec?.sebab || '-'}</td>
            </tr>`;
        });
        document.getElementById('classTableBody').innerHTML = html;
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
