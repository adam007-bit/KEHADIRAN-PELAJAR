<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Attend-X | Arkib & Analitik Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; }
        .login-box { max-width: 400px; margin: 100px auto; background: #1e293b; padding: 40px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .card { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; color: white; }
        .nav-tabs .nav-link { color: #94a3b8; font-weight: 600; border: none; }
        .nav-tabs .nav-link.active { color: #6366f1; border-bottom: 3px solid #6366f1; background: none; }
        .stat-value { font-size: 2rem; font-weight: 800; }
        .table { color: #cbd5e1; }
        
        /* Input Tarikh Style */
        .date-filter { background: #1e293b; color: white; border: 1px solid #334155; border-radius: 10px; padding: 8px 15px; }

        @media print { .no-print { display: none !important; } body { background: white; color: black; } }
    </style>
</head>
<body>

    <div id="authArea" class="login-box">
        <i class="fas fa-user-shield fa-3x text-info mb-3"></i>
        <h4 class="fw-bold">PORTAL PENGURUSAN</h4>
        <input type="password" id="passInput" class="form-control text-center my-3" placeholder="PIN 4-ANGKA" maxlength="4">
        <button onclick="checkPass()" class="btn btn-info w-100 rounded-pill fw-bold">LOG MASUK</button>
    </div>

    <div id="dashArea" class="container py-4" style="display:none;">
        <div class="d-flex justify-content-between align-items-center mb-4 no-print">
            <div>
                <h2 class="fw-bold m-0 text-info">ATTEND-X <span class="text-white">ARKIB</span></h2>
                <div class="mt-2">
                    <label class="small text-muted me-2">PILIH TARIKH LAPORAN:</label>
                    <input type="date" id="dateSelector" class="date-filter" onchange="runAnalytics()">
                </div>
            </div>
            <button onclick="window.print()" class="btn btn-outline-light rounded-pill"><i class="fas fa-print me-2"></i>Cetak</button>
        </div>

        <ul class="nav nav-tabs mb-4 no-print border-0" role="tablist">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#analitik">Ringkasan Tarikh</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#kehadiran">Semakan Per Kelas</button></li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="analitik">
                <div class="row g-3 mb-4 text-center">
                    <div class="col-6 col-md-3">
                        <div class="card p-3 border-bottom border-success border-4">
                            <small class="text-success fw-bold">TEPAT</small>
                            <div class="stat-value" id="per-hadir">0%</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="card p-3 border-bottom border-warning border-4">
                            <small class="text-warning fw-bold">LEWAT</small>
                            <div class="stat-value" id="per-lewat">0%</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="card p-3 border-bottom border-danger border-4">
                            <small class="text-danger fw-bold">PONTENG</small>
                            <div class="stat-value" id="per-ponteng">0%</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3 d-flex align-items-center justify-content-center">
                        <canvas id="miniChart" style="max-height: 100px;"></canvas>
                    </div>
                </div>

                <div class="card p-4">
                    <h6 class="fw-bold mb-3"><i class="fas fa-table me-2"></i>PRESTASI KELAS PADA <span id="labelTarikh" class="text-info">...</span></h6>
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                                <tr class="text-muted small">
                                    <th>KELAS</th><th>JUMLAH</th><th>HADIR</th><th>LEWAT</th><th>% PRESTASI</th>
                                </tr>
                            </thead>
                            <tbody id="statsBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="kehadiran">
                <div class="row mb-3 no-print">
                    <div class="col-md-4">
                        <select id="classSelector" class="form-select date-filter w-100" onchange="loadClassTable()">
                            <option value="">-- Pilih Kelas --</option>
                            <option value="1 IBNU SINA">1 IBNU SINA</option>
                            <option value="1 KARISMA">1 KARISMA</option>
                            <option value="1 SIMFONI">1 SIMFONI</option>
                        </select>
                    </div>
                </div>
                <div class="card p-4">
                    <table class="table">
                        <thead><tr class="text-muted"><th>Nama Murid</th><th>Status</th><th>Masa</th><th>Kaedah</th></tr></thead>
                        <tbody id="classTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

<script>
    // 1. Setup Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyA03bLm1Ztt6TzF-jzOa9CpjZn7mEYtIlQ",
        authDomain: "kehadiran-47efc.firebaseapp.com",
        projectId: "kehadiran-47efc",
        databaseURL: "https://kehadiran-47efc-default-rtdb.asia-southeast1.firebasedatabase.app",
        storageBucket: "kehadiran-47efc.firebasestorage.app",
        appId: "1:523088126436:web:6fb51d9888bcd18f7267f1"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    // Default tarikh hari ini
    document.getElementById('dateSelector').valueAsDate = new Date();

    function checkPass() {
        if(document.getElementById('passInput').value === "1234") {
            document.getElementById('authArea').style.display = 'none';
            document.getElementById('dashArea').style.display = 'block';
            runAnalytics();
        } else { Swal.fire('Ralat', 'PIN Salah', 'error'); }
    }

    let myChart = null;

    async function runAnalytics() {
        const targetDate = document.getElementById('dateSelector').value;
        document.getElementById('labelTarikh').innerText = targetDate;
        
        // Tarik data
        const studentsSnap = await db.ref('pelajar').once('value');
        const attendanceSnap = await db.ref(`kehadiran/${targetDate}`).once('value');
        
        const allStudents = studentsSnap.val() || {};
        const attendance = attendanceSnap.val() || {};

        let stats = {}; 
        let totalSch = 0, onTimeSch = 0, lateSch = 0;

        // Proses Data
        Object.keys(allStudents).forEach(id => {
            const cls = allStudents[id].class;
            if(!stats[cls]) stats[cls] = { total: 0, onTime: 0, late: 0 };
            
            stats[cls].total++;
            totalSch++;

            if(attendance[id]) {
                if(attendance[id].status === "HADIR") { stats[cls].onTime++; onTimeSch++; }
                else if(attendance[id].status === "LEWAT") { stats[cls].late++; lateSch++; }
            }
        });

        // Update UI Percentages
        const absentSch = totalSch - (onTimeSch + lateSch);
        document.getElementById('per-hadir').innerText = totalSch > 0 ? ((onTimeSch/totalSch)*100).toFixed(0) + "%" : "0%";
        document.getElementById('per-lewat').innerText = totalSch > 0 ? ((grandLate = (lateSch/totalSch)*100)).toFixed(0) + "%" : "0%";
        document.getElementById('per-ponteng').innerText = totalSch > 0 ? ((absentSch/totalSch)*100).toFixed(0) + "%" : "0%";

        drawChart(onTimeSch, lateSch, absentSch);

        // Render Table
        let rows = "";
        for(let cls in stats) {
            let present = stats[cls].onTime + stats[cls].late;
            let per = ((present / stats[cls].total) * 100).toFixed(1);
            rows += `<tr>
                <td class="fw-bold">${cls}</td>
                <td>${stats[cls].total}</td>
                <td class="text-success">${stats[cls].onTime}</td>
                <td class="text-warning">${stats[cls].late}</td>
                <td>
                    <div class="progress" style="height: 6px; background: #334155;">
                        <div class="progress-bar bg-info" style="width: ${per}%"></div>
                    </div>
                    <small>${per}%</small>
                </td>
            </tr>`;
        }
        document.getElementById('statsBody').innerHTML = rows;
        loadClassTable(); // Auto refresh table bawah jika tarikh tukar
    }

    function drawChart(h, l, p) {
        const ctx = document.getElementById('miniChart').getContext('2d');
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                datasets: [{
                    data: [h, l, p],
                    backgroundColor: ['#10b981', '#f59e0b', '#ef4444'],
                    borderWidth: 0
                }]
            },
            options: { cutout: '70%', plugins: { legend: { display: false } } }
        });
    }

    async function loadClassTable() {
        const cls = document.getElementById('classSelector').value;
        const targetDate = document.getElementById('dateSelector').value;
        if(!cls) return;

        const studentsSnap = await db.ref('pelajar').orderByChild('class').equalTo(cls).once('value');
        const attendSnap = await db.ref(`kehadiran/${targetDate}`).once('value');
        
        const students = studentsSnap.val() || {};
        const attend = attendSnap.val() || {};
        let html = "";

        Object.keys(students).forEach(id => {
            const s = students[id];
            const rec = attend[id];
            let badge = rec ? (rec.status === "LEWAT" ? '<span class="badge bg-warning text-dark">LEWAT</span>' : '<span class="badge bg-success">HADIR</span>') : '<span class="badge bg-danger">PONTENG</span>';

            html += `<tr>
                <td>${s.name}</td>
                <td>${badge}</td>
                <td>${rec ? rec.time : '-'}</td>
                <td class="small text-muted">${rec?.nota || '-'}</td>
            </tr>`;
        });
        document.getElementById('classTableBody').innerHTML = html;
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
