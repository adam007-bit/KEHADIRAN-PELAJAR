<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Guru | Attend-X Pro - Laporan Kehadiran</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        * { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: #f0f2f5;
            padding: 20px;
        }
        .header-guru {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .report-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
        }
        .stat-box {
            background: white;
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .stat-box.hadir { border-bottom: 4px solid #10b981; }
        .stat-box.lewat { border-bottom: 4px solid #f59e0b; }
        .stat-box.tiada { border-bottom: 4px solid #ef4444; }
        .stat-number { font-size: 2rem; font-weight: 800; margin: 5px 0; }
        
        .table-custom {
            width: 100%;
            border-collapse: collapse;
        }
        .table-custom th, .table-custom td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        .table-custom th {
            background: #f8fafc;
            font-weight: 600;
            color: #1e3c72;
        }
        .badge-hadir { background: #10b981; color: white; padding: 4px 12px; border-radius: 30px; font-size: 12px; }
        .badge-lewat { background: #f59e0b; color: white; padding: 4px 12px; border-radius: 30px; font-size: 12px; }
        .badge-tiada { background: #ef4444; color: white; padding: 4px 12px; border-radius: 30px; font-size: 12px; }
        
        .btn-print {
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 10px 24px;
            font-weight: 600;
        }
        .btn-print:hover { background: #4338ca; color: white; }
        
        @media print {
            body { background: white; padding: 0; }
            .no-print { display: none !important; }
            .report-card { box-shadow: none; padding: 0; }
            .table-custom th { background: #e2e8f0; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header-guru d-flex justify-content-between align-items-center flex-wrap">
        <div>
            <h2><i class="fas fa-chalkboard-user me-2"></i> Portal Guru</h2>
            <p class="mb-0 opacity-75">SMK Putra - Sistem Laporan Kehadiran</p>
        </div>
        <div class="mt-2 mt-sm-0">
            <button onclick="window.print()" class="btn-print no-print">
                <i class="fas fa-print me-2"></i> Cetak Laporan
            </button>
        </div>
    </div>
    
    <!-- Card Laporan -->
    <div class="report-card">
        <h4 class="mb-4"><i class="fas fa-chart-line text-primary me-2"></i> Laporan Kehadiran Harian</h4>
        
        <!-- Filter -->
        <div class="row g-3 mb-4 no-print">
            <div class="col-md-4">
                <label class="form-label small text-muted">Pilih Kelas</label>
                <select id="filterClass" class="form-select">
                    <option value="ALL">📚 SEMUA KELAS</option>
                    <option value="1 IBNU SINA">1 IBNU SINA</option>
                    <option value="1 KARISMA">1 KARISMA</option>
                    <option value="1 SIMFONI">1 SIMFONI</option>
                    <option value="2 AL-FARABI">2 AL-FARABI</option>
                    <option value="2 AL-BIRUNI">2 AL-BIRUNI</option>
                    <option value="3 IMAM AL-GHAZALI">3 IMAM AL-GHAZALI</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label small text-muted">Tarikh Laporan</label>
                <input type="date" id="reportDate" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label small text-muted">&nbsp;</label>
                <button onclick="loadReport()" class="btn btn-primary w-100 py-2" style="background: #1e3c72; border: none;">
                    <i class="fas fa-search me-2"></i> JANA LAPORAN
                </button>
            </div>
        </div>
        
        <!-- Ringkasan Statistik -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="stat-box hadir">
                    <i class="fas fa-check-circle text-success fs-4"></i>
                    <div class="stat-number text-success" id="totalHadir">0</div>
                    <small class="text-muted">Pelajar HADIR</small>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-box lewat">
                    <i class="fas fa-clock text-warning fs-4"></i>
                    <div class="stat-number text-warning" id="totalLewat">0</div>
                    <small class="text-muted">Pelajar LEWAT</small>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-box tiada">
                    <i class="fas fa-times-circle text-danger fs-4"></i>
                    <div class="stat-number text-danger" id="totalTiada">0</div>
                    <small class="text-muted">Pelajar TIADA</small>
                </div>
            </div>
        </div>
        
        <!-- Jadual Laporan -->
        <div style="overflow-x: auto;">
            <table class="table-custom">
                <thead>
                    <tr>
                        <th><i class="fas fa-user me-1"></i> Nama Pelajar</th>
                        <th><i class="fas fa-school me-1"></i> Kelas</th>
                        <th><i class="fas fa-flag-checkered me-1"></i> Status</th>
                        <th><i class="fas fa-clock me-1"></i> Masa Hadir</th>
                    </tr>
                </thead>
                <tbody id="reportTable">
                    <tr>
                        <td colspan="4" class="text-center text-muted py-4">
                            <i class="fas fa-calendar-alt fa-2x mb-2 d-block opacity-50"></i>
                            Pilih tarikh dan klik JANA LAPORAN
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="text-muted small mt-3 pt-2 border-top no-print">
            <i class="fas fa-info-circle me-1"></i> * HADIR: Sebelum 7:30 pagi | LEWAT: Selepas 7:30 pagi
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA03bLm1Ztt6TzF-jzOa9CpjZn7mEYtIlQ",
        databaseURL: "https://kehadiran-47efc-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "kehadiran-47efc",
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    // Set tarikh hari ini
    document.getElementById('reportDate').valueAsDate = new Date();
    
    async function loadReport() {
        const selectedClass = document.getElementById('filterClass').value;
        const selectedDate = document.getElementById('reportDate').value;
        
        if (!selectedDate) {
            Swal.fire('Error', 'Pilih tarikh laporan', 'error');
            return;
        }
        
        Swal.fire({ title: 'Memuatkan data...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
        
        try {
            // Dapatkan semua pelajar
            const studentsSnap = await db.ref('pelajar').once('value');
            let students = [];
            for (let [id, data] of Object.entries(studentsSnap.val() || {})) {
                students.push({ id, name: data.name, class: data.class });
            }
            
            // Filter ikut kelas
            if (selectedClass !== 'ALL') {
                students = students.filter(s => s.class === selectedClass);
            }
            
            // Dapatkan data kehadiran
            const attendanceSnap = await db.ref(`kehadiran/${selectedDate}`).once('value');
            const attendance = attendanceSnap.val() || {};
            
            let hadir = 0, lewat = 0, tiada = 0;
            let tableHTML = '';
            
            // Susun ikut nama
            students.sort((a,b) => a.name.localeCompare(b.name));
            
            for (let student of students) {
                const record = attendance[student.id];
                let status = 'TIADA';
                let statusClass = 'badge-tiada';
                let time = '-';
                
                if (record) {
                    if (record.status === 'HADIR') {
                        status = 'HADIR';
                        statusClass = 'badge-hadir';
                        hadir++;
                    } else if (record.status === 'LEWAT') {
                        status = 'LEWAT';
                        statusClass = 'badge-lewat';
                        lewat++;
                    }
                    time = record.time || '-';
                } else {
                    tiada++;
                }
                
                tableHTML += `<tr>
                    <td><strong>${student.name}</strong></td>
                    <td>${student.class}</td>
                    <td><span class="${statusClass}">${status}</span></td>
                    <td>${time}</td>
                </tr>`;
            }
            
            if (students.length === 0) {
                tableHTML = '<tr><td colspan="4" class="text-center text-muted">Tiada pelajar dalam kelas ini</td></tr>';
            }
            
            document.getElementById('reportTable').innerHTML = tableHTML;
            document.getElementById('totalHadir').innerText = hadir;
            document.getElementById('totalLewat').innerText = lewat;
            document.getElementById('totalTiada').innerText = tiada;
            
            Swal.close();
            
        } catch (error) {
            Swal.close();
            Swal.fire('Ralat', 'Gagal memuatkan data', 'error');
        }
    }
    
    // Load report on page load
    setTimeout(() => {
        if (document.getElementById('reportDate').value) loadReport();
    }, 500);
    
    window.loadReport = loadReport;
</script>
</body>
</html>
