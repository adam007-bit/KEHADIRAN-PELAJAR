<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attend-X Pro | Responsive Scanner</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root { --neon-blue: #6366f1; --dark-bg: #020617; }
        
        body { 
            background: var(--dark-bg); 
            color: white; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            min-height: 100vh;
            margin: 0;
            padding-bottom: 30px;
        }
        
        .header-section { 
            padding: 15px 0; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            background: rgba(15, 23, 42, 0.9); 
            backdrop-filter: blur(10px); 
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Scanner Container Responsive */
        #reader { 
            width: 100% !important; 
            border: 4px solid var(--neon-blue) !important; 
            border-radius: 25px !important; 
            overflow: hidden;
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.4);
            background: #000 !important;
        }

        /* Style internal camera library */
        #reader video { border-radius: 20px; object-fit: cover !important; }
        #reader__dashboard_section_csr button {
            background: var(--neon-blue) !important;
            color: white !important;
            border-radius: 8px !important;
            padding: 8px 15px !important;
            text-transform: uppercase;
            font-size: 12px !important;
            font-weight: bold !important;
        }

        /* Log Kehadiran Responsive */
        .log-box { 
            background: rgba(30, 41, 59, 0.4); 
            border-radius: 25px; 
            height: 500px; /* Tinggi tetap supaya tak ganggu layout */
            overflow-y: auto; 
            padding: 15px; 
            border: 1px solid rgba(255,255,255,0.1); 
        }

        .attendance-card { 
            background: rgba(15, 23, 42, 0.9); 
            border-radius: 15px; 
            padding: 12px 15px; 
            margin-bottom: 10px; 
            border-left: 5px solid #10b981; 
            font-size: 0.9rem;
        }

        .attendance-card.lewat { border-left-color: #ef4444; }
        
        .system-title { 
            font-family: 'Orbitron', sans-serif; 
            color: #38bdf8; 
            font-size: 1.2rem;
            margin: 0;
        }

        @media (max-width: 768px) {
            .system-title { font-size: 1rem; }
            #clock { font-size: 1.2rem !important; }
            .log-box { height: 400px; } /* Pendekkan sedikit di phone */
        }
    </style>
</head>
<body>

    <div class="header-section mb-4">
        <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
            <div>
                <h1 class="system-title fw-bold text-uppercase">Attend-X <span class="text-white d-none d-sm-inline">Scanner</span></h1>
                <small class="text-muted d-block" style="font-size: 0.7rem;" id="currentDate">Sistem Kehadiran</small>
            </div>
            <div class="text-end">
                <h3 class="m-0 fw-bold text-info" id="clock" style="font-size: 1.5rem;">00:00:00</h3>
                <span class="badge bg-primary rounded-pill small" style="font-size: 0.6rem;">SYSTEM LIVE</span>
            </div>
        </div>
    </div>

    <div class="container-fluid px-3 px-lg-5">
        <div class="row g-4">
            <div class="col-lg-6 col-md-12 text-center">
                <div id="reader" class="mx-auto"></div>
                
                <div class="mt-4">
                    <button onclick="manualCheckIn()" class="btn btn-outline-info rounded-pill px-4 py-2 fw-bold w-100 w-md-auto">
                        <i class="fas fa-keyboard me-2"></i>INPUT MANUAL
                    </button>
                </div>
            </div>

            <div class="col-lg-6 col-md-12">
                <h6 class="mb-3 text-info fw-bold text-uppercase"><i class="fas fa-history me-2"></i>Log Kehadiran Hari Ini</h6>
                <div id="log" class="log-box">
                    <div id="placeholder" class="text-center py-5 text-muted">
                        <i class="fas fa-camera fa-2x mb-3 opacity-25"></i>
                        <p>Menunggu imbasan pertama...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. Clock & Date
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('ms-MY');
            document.getElementById('currentDate').innerText = now.toLocaleDateString('ms-MY', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }, 1000);

        // 2. Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyA03bLm1Ztt6TzF-jzOa9CpjZn7mEYtIlQ",
            authDomain: "kehadiran-47efc.firebaseapp.com",
            projectId: "kehadiran-47efc",
            databaseURL: "https://kehadiran-47efc-default-rtdb.asia-southeast1.firebasedatabase.app",
            storageBucket: "kehadiran-47efc.firebasestorage.app",
            appId: "1:523088126436:web:6fb51d9888bcd18f7267f1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 3. Scanner Setup (Responsive QR Box)
        function onScanSuccess(decodedText) {
            recordAttendance(decodedText, "QR SCAN");
        }

        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { 
                fps: 15, 
                qrbox: (viewfinderWidth, viewfinderHeight) => {
                    // Kotak scan jadi 70% saiz skrin untuk senang imbas
                    let minEdgeSize = Math.min(viewfinderWidth, viewfinderHeight);
                    let qrboxSize = Math.floor(minEdgeSize * 0.7);
                    return { width: qrboxSize, height: qrboxSize };
                },
                aspectRatio: 1.333334 // 4:3
            }
        );
        html5QrcodeScanner.render(onScanSuccess);

        // 4. Record Logic
        function recordAttendance(id, method) {
            db.ref('pelajar/' + id).once('value').then(snap => {
                if(snap.exists()) {
                    const user = snap.val();
                    const now = new Date();
                    const today = now.toISOString().split('T')[0];
                    const time = now.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' });
                    
                    // Logik Lewat (7:30)
                    const status = (now.getHours() > 7 || (now.getHours() == 7 && now.getMinutes() > 30)) ? "LEWAT" : "HADIR";

                    db.ref(`kehadiran/${today}/${id}`).set({
                        name: user.name, class: user.class, time: time, status: status, nota: method
                    }).then(() => {
                        // Voice Feedback
                        const speech = new SpeechSynthesisUtterance(`${user.name}, terima kasih.`);
                        speech.lang = 'ms-MY';
                        window.speechSynthesis.speak(speech);

                        // Update UI
                        if(document.getElementById('placeholder')) document.getElementById('placeholder').remove();

                        const html = `
                            <div class="attendance-card ${status == 'LEWAT' ? 'lewat' : ''} animate__animated animate__fadeInDown">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div style="max-width: 70%;">
                                        <div class="fw-bold text-white text-truncate">${user.name}</div>
                                        <small class="text-muted">${user.class} • ${time}</small>
                                    </div>
                                    <span class="badge ${status == 'LEWAT' ? 'bg-danger' : 'bg-success'} rounded-pill">${status}</span>
                                </div>
                            </div>`;
                        document.getElementById('log').insertAdjacentHTML('afterbegin', html);
                    });
                } else {
                    Swal.fire({ title: 'Ralat', text: 'ID tidak ditemui!', icon: 'error', toast: true, position: 'top-end', timer: 3000, showConfirmButton: false });
                }
            });
        }

        function manualCheckIn() {
            Swal.fire({
                title: 'Input Manual',
                input: 'text',
                inputPlaceholder: 'Masukkan ID Murid',
                background: '#1e293b',
                color: '#fff',
                showCancelButton: true,
                confirmButtonColor: '#6366f1'
            }).then(res => { if(res.value) recordAttendance(res.value, "MANUAL"); });
        }
    </script>
</body>
</html>
