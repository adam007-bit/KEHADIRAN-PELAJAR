<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attend-X Pro | Smart Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://rawgit.com/schmich/instascan-builds/master/instascan.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --neon-indigo: #6366f1;
            --neon-cyan: #06b6d4;
            --bg-dark: #020617;
        }

        body { 
            background: var(--bg-dark); 
            color: white; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        /* Header Styling */
        .kiosk-header {
            padding: 20px 40px;
            background: rgba(15, 23, 42, 0.8);
            border-bottom: 1px solid rgba(99, 102, 241, 0.2);
            backdrop-filter: blur(10px);
        }

        .system-title {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 3px;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
        }

        /* Camera Container */
        .scanner-wrapper {
            position: relative;
            max-width: 550px;
            margin: 0 auto;
            border-radius: 40px;
            padding: 10px;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .v-container { 
            border: 2px solid rgba(99, 102, 241, 0.3); 
            border-radius: 30px; 
            position: relative; 
            overflow: hidden; 
            background: #000;
            aspect-ratio: 4/3;
        }

        video { width: 100%; height: 100%; object-fit: cover; }

        /* Scanning Animation */
        .scan-anim { 
            width: 100%; 
            height: 4px; 
            background: linear-gradient(90deg, transparent, var(--neon-indigo), transparent);
            position: absolute; 
            top: 0;
            z-index: 10;
            animation: scanLine 3s infinite ease-in-out; 
            box-shadow: 0 0 20px var(--neon-indigo); 
        }

        @keyframes scanLine {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* Log Box Styling */
        .log-box { 
            background: rgba(30, 41, 59, 0.5); 
            border-radius: 24px; 
            height: calc(100vh - 180px); 
            overflow-y: auto; 
            padding: 20px; 
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(5px);
        }

        .attendance-card {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 12px;
            border-left: 5px solid #10b981;
            transition: 0.3s;
            animation: slideIn 0.4s ease-out;
        }

        .attendance-card.lewat { border-left-color: #ef4444; }

        @keyframes slideIn {
            from { transform: translateX(30px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Custom Scrollbar */
        .log-box::-webkit-scrollbar { width: 6px; }
        .log-box::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.3); border-radius: 10px; }

        .btn-manual {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid var(--neon-indigo);
            color: white;
            transition: 0.3s;
        }

        .btn-manual:hover {
            background: var(--neon-indigo);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body>

    <header class="kiosk-header d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="system-title fw-bold m-0 text-uppercase">Attend-X <span class="text-white">Kiosk</span></h2>
            <small class="text-muted" id="currentDate">Sistem Kehadiran Pintar</small>
        </div>
        <div class="text-end">
            <h4 class="m-0 fw-bold" id="clockText">00:00:00</h4>
            <span class="badge bg-success shadow-sm">SISTEM AKTIF</span>
        </div>
    </header>

    <div class="container-fluid px-5">
        <div class="row g-5">
            <div class="col-lg-6 text-center">
                <div class="scanner-wrapper">
                    <div class="v-container shadow-2xl">
                        <video id="preview"></video>
                        <div class="scan-anim"></div>
                    </div>
                </div>
                
                <div class="mt-5 d-flex justify-content-center gap-3">
                    <button onclick="manualCheckIn()" class="btn btn-manual rounded-pill px-5 py-3 fw-bold">
                        <i class="fas fa-keyboard me-2"></i>INPUT MANUAL
                    </button>
                </div>
            </div>

            <div class="col-lg-6">
                <h5 class="fw-bold mb-4 d-flex align-items-center">
                    <span class="p-2 bg-primary rounded-3 me-3"><i class="fas fa-history"></i></span>
                    AKTIVITI TERKINI
                </h5>
                <div id="log" class="log-box">
                    <div class="text-center py-5 text-muted opacity-50">
                        <i class="fas fa-qrcode fa-3x mb-3"></i>
                        <p>Sila imbas kod QR anda pada kamera</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Real-time Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clockText').innerText = now.toLocaleTimeString('ms-MY');
            document.getElementById('currentDate').innerText = now.toLocaleDateString('ms-MY', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        const firebaseConfig = {
            apiKey: "AIzaSyA03bLm1Ztt6TzF-jzOa9CpjZn7mEYtIlQ",
            authDomain: "kehadiran-47efc.firebaseapp.com",
            projectId: "kehadiran-47efc",
            databaseURL: "https://kehadiran-47efc-default-rtdb.asia-southeast1.firebasedatabase.app",
            appId: "1:523088126436:web:6fb51d9888bcd18f7267f1"
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        let scanner = new Instascan.Scanner({ 
            video: document.getElementById('preview'), 
            mirror: false,
            backgroundScan: false 
        });
        
        scanner.addListener('scan', id => recordAttendance(id, "QR SCAN"));

        Instascan.Camera.getCameras().then(cameras => {
            if (cameras.length > 0) {
                let backCam = cameras.find(cam => cam.name.toLowerCase().includes('back'));
                scanner.start(backCam || cameras[0]);
            } else {
                Swal.fire('Ralat', 'Kamera tidak dikesan.', 'error');
            }
        }).catch(e => {
            Swal.fire('Kebenaran', 'Sila benarkan akses kamera.', 'warning');
        });

        function recordAttendance(id, method) {
            db.ref('pelajar/' + id).once('value').then(snap => {
                if(snap.exists()) {
                    const user = snap.val();
                    const now = new Date();
                    const today = now.toISOString().split('T')[0];
                    const timeStr = now.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' });
                    const status = (now.getHours() > 7 || (now.getHours() == 7 && now.getMinutes() > 30)) ? "LEWAT" : "HADIR";

                    db.ref(`kehadiran/${today}/${id}`).set({
                        name: user.name, class: user.class, time: timeStr, status: status, nota: method
                    }).then(() => {
                        window.speechSynthesis.speak(new SpeechSynthesisUtterance(`${user.name}, selamat datang.`));
                        
                        const logDiv = document.getElementById('log');
                        if(logDiv.innerHTML.includes('Sila imbas')) logDiv.innerHTML = '';

                        const html = `
                            <div class="attendance-card ${status == 'LEWAT' ? 'lewat' : ''}">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <h6 class="fw-bold m-0 text-uppercase">${user.name}</h6>
                                        <small class="text-muted">${user.class} • ${timeStr}</small>
                                    </div>
                                    <div class="text-end">
                                        <span class="badge ${status == 'LEWAT' ? 'bg-danger' : 'bg-success'} mb-1">${status}</span>
                                        <br><small style="font-size: 10px" class="text-uppercase text-secondary">${method}</small>
                                    </div>
                                </div>
                            </div>`;
                        logDiv.innerHTML = html + logDiv.innerHTML;
                    });
                } else {
                    Swal.fire({ title: 'ID Tidak Sah', text: 'Pelajar tiada dalam rekod.', icon: 'error', background: '#0f172a', color: '#fff' });
                }
            });
        }

        function manualCheckIn() {
            Swal.fire({
                title: 'Input Manual',
                input: 'text',
                inputPlaceholder: 'Taip ID Murid...',
                showCancelButton: true,
                background: '#0f172a',
                color: '#fff',
                confirmButtonColor: '#6366f1'
            }).then(res => { if(res.value) recordAttendance(res.value, "MANUAL"); });
        }
    </script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
