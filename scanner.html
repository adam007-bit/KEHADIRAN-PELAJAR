<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Scanner Pagar | Attend-X</title>
    <script src="https://rawgit.com/schmich/instascan-builds/master/instascan.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        .v-container { border: 5px solid #6366f1; border-radius: 30px; position: relative; overflow: hidden; max-width: 450px; margin: 0 auto; }
        .scan-anim { width: 100%; height: 4px; background: #6366f1; position: absolute; animation: scan 2s infinite linear; box-shadow: 0 0 15px #6366f1; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        .log-box { background: rgba(255,255,255,0.05); border-radius: 20px; height: 400px; overflow-y: auto; padding: 15px; }
    </style>
</head>
<body class="p-4">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-6 text-center">
                <h1 class="fw-bold text-indigo mb-4">PINTU PAGAR SEKOLAH</h1>
                <div class="v-container shadow-lg">
                    <video id="preview" class="w-100"></video>
                    <div class="scan-anim"></div>
                </div>
                <div class="mt-4">
                    <button onclick="manualCheckIn()" class="btn btn-outline-info rounded-pill px-4">
                        <i class="fas fa-keyboard me-2"></i>LUPA KAD? MASUK MANUAL
                    </button>
                </div>
            </div>
            <div class="col-md-6">
                <h4 class="mb-3 text-info">KEHADIRAN TERKINI</h4>
                <div id="log" class="log-box"></div>
            </div>
        </div>
    </div>

    <script>
        firebase.initializeApp({
            databaseURL: "https://kehadiran-47efc-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "kehadiran-47efc"
        });
         const firebaseConfig = {
        apiKey: "AIzaSyA03bLm1Ztt6TzF-jzOa9CpjZn7mEYtIlQ",
        authDomain: "kehadiran-47efc.firebaseapp.com",
        projectId: "kehadiran-47efc",
        databaseURL: "https://kehadiran-47efc-default-rtdb.asia-southeast1.firebasedatabase.app",
        storageBucket: "kehadiran-47efc.firebasestorage.app",
        appId: "1:523088126436:web:6fb51d9888bcd18f7267f1"
    };

        let scanner = new Instascan.Scanner({ video: document.getElementById('preview'), mirror: false });
        
        scanner.addListener('scan', function (id) {
            recordAttendance(id, "QR SCAN");
        });

        function manualCheckIn() {
            Swal.fire({
                title: 'Masukkan ID Murid',
                input: 'text',
                showCancelButton: true,
                confirmButtonText: 'Rekod'
            }).then(res => { if(res.value) recordAttendance(res.value, "MANUAL (LUPA KAD)"); });
        }

        function recordAttendance(id, method) {
            db.ref('pelajar/' + id).once('value').then(snap => {
                if(snap.exists()) {
                    const user = snap.val();
                    const now = new Date();
                    const today = now.toISOString().split('T')[0];
                    const time = now.toLocaleTimeString('ms-MY');
                    const status = (now.getHours() > 7 || (now.getHours() == 7 && now.getMinutes() > 30)) ? "LEWAT" : "HADIR";

                    db.ref(`kehadiran/${today}/${id}`).set({
                        name: user.name, class: user.class, time: time, status: status, nota: method
                    });

                    // Suara Sambutan
                    window.speechSynthesis.speak(new SpeechSynthesisUtterance(`${user.name}, selamat datang.`));

                    const html = `<div class="p-3 mb-2 rounded bg-dark border-start border-4 ${status=='LEWAT'?'border-danger':'border-success'}">
                        <strong>${user.name}</strong> <span class="badge ${status=='LEWAT'?'bg-danger':'bg-success'} float-end">${status}</span>
                        <br><small class="text-muted">${user.class} • ${time} (${method})</small>
                    </div>`;
                    document.getElementById('log').innerHTML = html + document.getElementById('log').innerHTML;
                } else {
                    Swal.fire('Ralat', 'ID Tidak Dijumpai', 'error');
                }
            });
        }

        Instascan.Camera.getCameras().then(c => { if(c.length>0) scanner.start(c[0]); });
    </script>
</body>
</html>
