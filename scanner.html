<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attend-X Pro | SMK Putra Secure Scanner</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root { --neon-blue: #6366f1; --dark-bg: #020617; }
        body { background: var(--dark-bg); color: white; font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; }
        
        .header-section { 
            padding: 15px 0; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            background: rgba(15, 23, 42, 0.9); 
            backdrop-filter: blur(10px); 
            position: sticky; top: 0; z-index: 100; 
        }
        
        #reader { 
            width: 100% !important; 
            border: 4px solid var(--neon-blue) !important; 
            border-radius: 25px !important; 
            overflow: hidden;
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.4);
            background: #000 !important;
        }

        .log-box { 
            background: rgba(30, 41, 59, 0.4); 
            border-radius: 25px; 
            height: 480px; 
            overflow-y: auto; 
            padding: 15px; 
            border: 1px solid rgba(255,255,255,0.1); 
        }

        .attendance-card { 
            background: rgba(15, 23, 42, 0.9); 
            border-radius: 15px; 
            padding: 12px 15px; 
            margin-bottom: 10px; 
            border-left: 5px solid #10b981; 
        }
        .attendance-card.lewat { border-left-color: #ef4444; }
        .system-title { font-family: 'Orbitron', sans-serif; color: #38bdf8; font-size: 1.2rem; }

        /* Custom Scrollbar */
        .log-box::-webkit-scrollbar { width: 5px; }
        .log-box::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; }
    </style>
</head>
<body>

    <audio id="beepAudio" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" type="audio/mpeg">
    </audio>

    <div class="header-section mb-4">
        <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
            <div>
                <h1 class="system-title fw-bold m-0">ATTEND-X SCANNER</h1>
                <small class="text-muted" id="currentDate">Memuatkan...</small>
            </div>
            <div class="text-end">
                <h3 class="m-0 fw-bold text-info" id="clock">00:00:00</h3>
                <span class="badge bg-primary px-3 rounded-pill"><i class="fas fa-map-marker-alt me-1"></i> SMK PUTRA</span>
            </div>
        </div>
    </div>

    <div class="container-fluid px-3 px-lg-5">
        <div class="row g-4">
            <div class="col-lg-6 text-center">
                <div id="reader"></div>
                <div class="d-flex gap-2 mt-3">
                    <button onclick="manualCheckIn()" class="btn btn-outline-info rounded-pill px-4 py-3 fw-bold w-100">
                        <i class="fas fa-keyboard me-2"></i>INPUT MANUAL
                    </button>
                </div>
                <p class="mt-3 text-muted small"><i class="fas fa-shield-alt me-1"></i> Sistem dilindungi Geofencing GPS (Radius 150m)</p>
            </div>

            <div class="col-lg-6">
                <h6 class="mb-3 text-info fw-bold text-uppercase">
                    <i class="fas fa-history me-2"></i>Log Kehadiran Hari Ini
                </h6>
                <div id="log" class="log-box">
                    <div id="placeholder" class="text-center py-5 text-muted">
                        <i class="fas fa-qrcode fa-3x mb-3 opacity-25"></i>
                        <p>Sila scan kod QR anda atau masukkan ID secara manual.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATIONS ---
        const SMK_PUTRA_LAT = 6.443152; 
        const SMK_PUTRA_LNG = 100.215234;
        const RADIUS_BENAR = 0.15; // 150 meter limit

        const firebaseConfig = {
            apiKey: "AIzaSyA03bLm1Ztt6TzF-jzOa9CpjZn7mEYtIlQ",
            authDomain: "kehadiran-47efc.firebaseapp.com",
            projectId: "kehadiran-47efc",
            databaseURL: "https://kehadiran-47efc-default-rtdb.asia-southeast1.firebasedatabase.app",
            storageBucket: "kehadiran-47efc.firebasestorage.app",
            appId: "1:523088126436:web:6fb51d9888bcd18f7267f1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- 2. CLOCK & UI HELPERS ---
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('ms-MY');
            document.getElementById('currentDate').innerText = now.toLocaleDateString('ms-MY', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }, 1000);

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c; 
        }

        // --- 3. SCANNER ENGINE ---
        const html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
            fps: 10, 
            qrbox: { width: 250, height: 250 },
            aspectRatio: 1.0
        });
        html5QrcodeScanner.render((decodedText) => recordAttendance(decodedText, "QR SCAN"));

        // --- 4. CORE LOGIC (GPS + FIREBASE) ---
        function recordAttendance(id, method) {
            // Loading alert
            Swal.fire({
                title: 'Mengesahkan Lokasi...',
                text: 'Sila tunggu sementara kami menyemak GPS.',
                allowOutsideClick: false,
                background: '#1e293b',
                color: '#fff',
                didOpen: () => { Swal.showLoading(); }
            });

            if (!navigator.geolocation) {
                Swal.close();
                return Swal.fire('Ralat', 'Browser tidak sokong GPS.', 'error');
            }

            navigator.geolocation.getCurrentPosition((position) => {
                const userLat = position.coords.latitude;
                const userLng = position.coords.longitude;
                const jarak = calculateDistance(userLat, userLng, SMK_PUTRA_LAT, SMK_PUTRA_LNG);

                // GEOFENCE CHECK
                if (jarak > RADIUS_BENAR) {
                    Swal.close();
                    return Swal.fire({
                        title: 'LUAR KAWASAN!',
                        text: `Anda dikesan berada ${(jarak * 1000).toFixed(0)}m dari SMK Putra. Sila scan di lokasi sekolah sahaja.`,
                        icon: 'error',
                        background: '#1e293b',
                        color: '#fff'
                    });
                }

                // PROSES KE FIREBASE
                const now = new Date();
                const today = now.toISOString().split('T')[0];

                db.ref(`kehadiran/${today}/${id}`).once('value').then(snap => {
                    Swal.close();
                    if(snap.exists()) {
                        return Swal.fire({
                            title: 'Sudah Hadir',
                            text: 'Anda telah merekodkan kehadiran hari ini.',
                            icon: 'info',
                            timer: 2000,
                            showConfirmButton: false,
                            background: '#1e293b',
                            color: '#fff'
                        });
                    }

                    db.ref('pelajar/' + id).once('value').then(studentSnap => {
                        if(studentSnap.exists()) {
                            const user = studentSnap.val();
                            document.getElementById('beepAudio').play();
                            if (navigator.vibrate) navigator.vibrate(200);

                            const time = now.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' });
                            const status = (now.getHours() > 7 || (now.getHours() == 7 && now.getMinutes() > 30)) ? "LEWAT" : "HADIR";

                            db.ref(`kehadiran/${today}/${id}`).set({
                                name: user.name, 
                                class: user.class, 
                                time: time, 
                                status: status, 
                                method: method,
                                loc: `${userLat.toFixed(6)},${userLng.toFixed(6)}`
                            }).then(() => {
                                // Voice Greeting
                                const speech = new SpeechSynthesisUtterance(`Selamat datang ${user.name}`);
                                speech.lang = 'ms-MY';
                                window.speechSynthesis.speak(speech);

                                updateUI(user.name, user.class, time, status);
                            });
                        } else {
                            Swal.fire({ title: 'ID Tidak Sah', text: 'ID pelajar ini tidak ditemui dalam sistem.', icon: 'warning', background: '#1e293b', color: '#fff' });
                        }
                    });
                });

            }, (error) => {
                Swal.close();
                Swal.fire('GPS Gagal', 'Sila hidupkan lokasi telefon anda dan benarkan akses (Allow).', 'warning');
            }, { enableHighAccuracy: true });
        }

        function updateUI(name, kelas, time, status) {
            if(document.getElementById('placeholder')) document.getElementById('placeholder').remove();
            const html = `
                <div class="attendance-card ${status == 'LEWAT' ? 'lewat' : ''} animate__animated animate__fadeInDown">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <div class="fw-bold">${name}</div>
                            <small class="text-muted">${kelas} • ${time}</small>
                        </div>
                        <span class="badge ${status == 'LEWAT' ? 'bg-danger' : 'bg-success'} rounded-pill">${status}</span>
                    </div>
                </div>`;
            document.getElementById('log').insertAdjacentHTML('afterbegin', html);
        }

        function manualCheckIn() {
            Swal.fire({
                title: 'Input Manual ID',
                input: 'text',
                inputPlaceholder: 'Masukkan ID Pelajar...',
                background: '#1e293b',
                color: '#fff',
                showCancelButton: true,
                confirmButtonText: 'Semak Lokasi & Hadir'
            }).then(res => { 
                if(res.value) recordAttendance(res.value, "MANUAL"); 
            });
        }
    </script>
</body>
</html>
