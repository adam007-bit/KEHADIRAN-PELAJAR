<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attend-X Pro | Secure Scanner</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root { --neon-blue: #6366f1; --dark-bg: #020617; }
        body { background: var(--dark-bg); color: white; font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; }
        .header-section { padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); sticky: top; z-index: 100; }
        
        #reader { 
            width: 100% !important; 
            border: 4px solid var(--neon-blue) !important; 
            border-radius: 25px !important; 
            overflow: hidden;
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.4);
            background: #000 !important;
        }

        .log-box { background: rgba(30, 41, 59, 0.4); border-radius: 25px; height: 450px; overflow-y: auto; padding: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .attendance-card { background: rgba(15, 23, 42, 0.9); border-radius: 15px; padding: 12px 15px; margin-bottom: 10px; border-left: 5px solid #10b981; }
        .attendance-card.lewat { border-left-color: #ef4444; }
        .system-title { font-family: 'Orbitron', sans-serif; color: #38bdf8; font-size: 1.2rem; }
    </style>
</head>
<body>

    <audio id="beepAudio" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" type="audio/mpeg">
    </audio>

    <div class="header-section mb-4">
        <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
            <div>
                <h1 class="system-title fw-bold">ATTEND-X SCANNER</h1>
                <small class="text-muted" id="currentDate">Memuatkan tarikh...</small>
            </div>
            <div class="text-end">
                <h3 class="m-0 fw-bold text-info" id="clock">00:00:00</h3>
            </div>
        </div>
    </div>

    <div class="container-fluid px-3 px-lg-5">
        <div class="row g-4">
            <div class="col-lg-6 text-center">
                <div id="reader"></div>
                <button onclick="manualCheckIn()" class="btn btn-outline-info rounded-pill px-5 py-3 mt-4 fw-bold w-100">
                    <i class="fas fa-keyboard me-2"></i>INPUT MANUAL
                </button>
            </div>

            <div class="col-lg-6">
                <h6 class="mb-3 text-info fw-bold text-uppercase"><i class="fas fa-history me-2"></i>Log Kehadiran Hari Ini</h6>
                <div id="log" class="log-box">
                    <div id="placeholder" class="text-center py-5 text-muted">
                        <p>Menunggu imbasan...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. Clock & Date
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('ms-MY');
            document.getElementById('currentDate').innerText = now.toLocaleDateString('ms-MY', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }, 1000);

        // 2. Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA03bLm1Ztt6TzF-jzOa9CpjZn7mEYtIlQ",
            authDomain: "kehadiran-47efc.firebaseapp.com",
            projectId: "kehadiran-47efc",
            databaseURL: "https://kehadiran-47efc-default-rtdb.asia-southeast1.firebasedatabase.app",
            storageBucket: "kehadiran-47efc.firebasestorage.app",
            appId: "1:523088126436:web:6fb51d9888bcd18f7267f1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 3. Scanner Logic
        const html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
            fps: 10, 
            qrbox: { width: 250, height: 250 },
            aspectRatio: 1.0
        });
        html5QrcodeScanner.render((decodedText) => recordAttendance(decodedText, "QR SCAN"));

        // 4. Main Function
        function recordAttendance(id, method) {
            const now = new Date();
            const today = now.toISOString().split('T')[0];

            // A. Check if already scanned today
            db.ref(`kehadiran/${today}/${id}`).once('value').then(snap => {
                if(snap.exists()) {
                    // Alert jika sudah scan
                    Swal.fire({
                        title: 'Sudah Hadir',
                        text: 'Pelajar ini telah pun mendaftar hari ini.',
                        icon: 'info',
                        timer: 2000,
                        showConfirmButton: false,
                        background: '#1e293b',
                        color: '#fff'
                    });
                    return; // Stop process
                }

                // B. If not scanned, verify Student ID
                db.ref('pelajar/' + id).once('value').then(studentSnap => {
                    if(studentSnap.exists()) {
                        const user = studentSnap.val();
                        
                        // Play Sound & Vibrate
                        document.getElementById('beepAudio').play();
                        if (navigator.vibrate) navigator.vibrate(200);

                        const time = now.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' });
                        const status = (now.getHours() > 7 || (now.getHours() == 7 && now.getMinutes() > 30)) ? "LEWAT" : "HADIR";

                        // C. Write to Database
                        db.ref(`kehadiran/${today}/${id}`).set({
                            name: user.name, class: user.class, time: time, status: status, nota: method
                        }).then(() => {
                            // Voice Greeting
                            const speech = new SpeechSynthesisUtterance(`${user.name}, selamat datang.`);
                            speech.lang = 'ms-MY';
                            window.speechSynthesis.speak(speech);

                            updateUI(user.name, user.class, time, status);
                        });
                    } else {
                        Swal.fire({ title: 'Ralat', text: 'ID Murid tidak wujud!', icon: 'error', background: '#1e293b', color: '#fff' });
                    }
                });
            });
        }

        function updateUI(name, kelas, time, status) {
            if(document.getElementById('placeholder')) document.getElementById('placeholder').remove();
            const html = `
                <div class="attendance-card ${status == 'LEWAT' ? 'lewat' : ''} animate__animated animate__fadeInDown">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <div class="fw-bold">${name}</div>
                            <small class="text-muted">${kelas} • ${time}</small>
                        </div>
                        <span class="badge ${status == 'LEWAT' ? 'bg-danger' : 'bg-success'} rounded-pill">${status}</span>
                    </div>
                </div>`;
            document.getElementById('log').insertAdjacentHTML('afterbegin', html);
        }

        function manualCheckIn() {
            Swal.fire({
                title: 'Input Manual',
                input: 'text',
                background: '#1e293b',
                color: '#fff',
                showCancelButton: true
            }).then(res => { if(res.value) recordAttendance(res.value, "MANUAL"); });
        }
    </script>
</body>
</html>
