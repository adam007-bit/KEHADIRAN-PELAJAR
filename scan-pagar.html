<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Pagar | Attend-X Pro</title>
    
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .scanner-box {
            background: #1e293b;
            border-radius: 30px;
            padding: 20px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        #reader {
            width: 100% !important;
            border-radius: 20px !important;
            overflow: hidden;
            border: 3px solid #10b981 !important;
        }
        .status-bar {
            background: #0f172a;
            border-radius: 20px;
            padding: 15px;
            margin-top: 15px;
            color: white;
        }
        .success-scan {
            background: #10b981;
            color: white;
            padding: 10px;
            border-radius: 15px;
            margin-top: 10px;
        }
        .info-text {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="scanner-box">
    <h3 class="text-white mb-3">
        <i class="fas fa-qrcode"></i> SCAN KAD PELAJAR
    </h3>
    <p class="text-muted small">Letakkan kad QR di depan kamera</p>
    
    <div id="reader"></div>
    
    <div id="scanStatus" class="status-bar">
        <i class="fas fa-camera"></i> Menunggu scan...
    </div>
    
    <div class="info-text">
        <i class="fas fa-info-circle"></i> Sistem auto rekod HADIR/LEWAT berdasarkan waktu
    </div>
</div>

<audio id="successSound" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" type="audio/mpeg">
</audio>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyA03bLm1Ztt6TzF-jzOa9CpjZn7mEYtIlQ",
        databaseURL: "https://kehadiran-47efc-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "kehadiran-47efc",
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let scanner = null;
    let lastScan = null;
    
    function playSound() {
        const audio = document.getElementById('successSound');
        audio.play().catch(e => console.log("Audio error"));
    }
    
    async function processAttendance(studentId) {
        const now = new Date();
        const today = now.toISOString().split('T')[0];
        const timeStr = now.toLocaleTimeString('ms-MY');
        const hour = now.getHours();
        const minute = now.getMinutes();
        
        // Tentukan status (LEWAT jika lepas 7:30 pagi)
        const status = (hour > 7 || (hour === 7 && minute > 30)) ? "LEWAT" : "HADIR";
        
        try {
            // Cek pelajar wujud
            const studentSnap = await db.ref(`pelajar/${studentId}`).once('value');
            if (!studentSnap.exists()) {
                document.getElementById('scanStatus').innerHTML = `
                    <i class="fas fa-times-circle text-danger"></i> ID TIDAK SAH! Pelajar tidak berdaftar.
                `;
                setTimeout(() => {
                    document.getElementById('scanStatus').innerHTML = `<i class="fas fa-camera"></i> Menunggu scan...`;
                }, 2000);
                return false;
            }
            
            const student = studentSnap.val();
            
            // Cek sudah hadir ke belum hari ini
            const existing = await db.ref(`kehadiran/${today}/${studentId}`).once('value');
            if (existing.exists()) {
                document.getElementById('scanStatus').innerHTML = `
                    <div class="success-scan" style="background: #f59e0b;">
                        <i class="fas fa-clock"></i> SUDAH HADIR!<br>
                        ${student.name} telah hadir pada ${existing.val().time}
                    </div>
                `;
                setTimeout(() => {
                    document.getElementById('scanStatus').innerHTML = `<i class="fas fa-camera"></i> Menunggu scan...`;
                }, 2000);
                return false;
            }
            
            // Rekod kehadiran
            await db.ref(`kehadiran/${today}/${studentId}`).set({
                name: student.name,
                class: student.class,
                time: timeStr,
                status: status,
                method: "SCAN PAGAR",
                timestamp: Date.now()
            });
            
            // Success!
            playSound();
            document.getElementById('scanStatus').innerHTML = `
                <div class="success-scan">
                    <i class="fas fa-check-circle"></i> ${status === 'HADIR' ? 'HADIR' : 'LEWAT'}<br>
                    ${student.name}<br>
                    <small>${student.class} | ${timeStr}</small>
                </div>
            `;
            
            // Ucapan suara (optional)
            const speech = new SpeechSynthesisUtterance(`${student.name}, ${status === 'HADIR' ? 'Selamat Pagi' : 'Anda lewat'}`);
            speech.lang = 'ms-MY';
            window.speechSynthesis.speak(speech);
            
            setTimeout(() => {
                document.getElementById('scanStatus').innerHTML = `<i class="fas fa-camera"></i> Sedia untuk scan seterusnya...`;
            }, 3000);
            
            return true;
            
        } catch (error) {
            console.error(error);
            document.getElementById('scanStatus').innerHTML = `<i class="fas fa-exclamation-triangle text-danger"></i> Ralat sistem`;
            return false;
        }
    }
    
    // Init scanner
    function initScanner() {
        const scannerElem = document.getElementById('reader');
        if (scannerElem) scannerElem.innerHTML = '';
        
        scanner = new Html5Qrcode("reader");
        scanner.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 300, height: 300 } },
            (decodedText) => {
                // Prevent multiple scan same time
                if (lastScan && Date.now() - lastScan < 3000) return;
                lastScan = Date.now();
                processAttendance(decodedText.trim());
            },
            (error) => { /* silent */ }
        ).catch(err => console.log("Scanner error:", err));
    }
    
    // Start scanner when page loads
    window.addEventListener('load', () => {
        setTimeout(initScanner, 500);
    });
</script>
</body>
</html>
