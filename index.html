<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Attend-X | Pendaftaran Pelajar Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body { background: #0f172a; color: white; font-family: 'Plus Jakarta Sans', sans-serif; }
        .reg-card { background: #1e293b; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); max-width: 500px; margin: 50px auto; padding: 30px; }
        .form-control { background: #0f172a; border: 1px solid #334155; color: white; border-radius: 10px; }
        .form-control:focus { background: #0f172a; color: white; border-color: #6366f1; box-shadow: none; }
        #qr-result { background: white; padding: 20px; border-radius: 15px; display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="reg-card shadow-lg">
        <h3 class="fw-bold text-info mb-1"><i class="fas fa-user-plus me-2"></i>DAFTAR MURID</h3>
        <p class="text-muted small mb-4">Sila isi maklumat untuk jana kad ID pintar.</p>

        <div class="mb-3">
            <label class="small text-muted">ID Pelajar (Nombor Kad Pengenalan/Siri)</label>
            <input type="text" id="stuID" class="form-control form-control-lg" placeholder="Contoh: 050101020304">
        </div>
        <div class="mb-3">
            <label class="small text-muted">Nama Penuh</label>
            <input type="text" id="stuName" class="form-control" placeholder="NAMA PENUH">
        </div>
        <div class="mb-4">
            <label class="small text-muted">Kelas</label>
            <select id="stuClass" class="form-control">
                <option value="1 IBNU SINA">1 IBNU SINA</option>
                <option value="1 KARISMA">1 KARISMA</option>
                <option value="1 SIMFONI">1 SIMFONI</option>
            </select>
        </div>

        <button onclick="checkAndRegister()" class="btn btn-info w-100 py-3 rounded-pill fw-bold">
            PROSES PENDAFTARAN
        </button>

        <div id="displayArea" class="text-center mt-4" style="display:none;">
            <hr class="border-secondary">
            <h6 class="text-warning fw-bold" id="msgStatus">KAD DIGITAL JANAAN</h6>
            <div id="qr-result"></div>
            <div class="mt-3">
                <h5 id="displayName" class="mb-0 fw-bold"></h5>
                <p id="displayID" class="text-info"></p>
                <button onclick="window.print()" class="btn btn-sm btn-outline-light rounded-pill no-print">
                    <i class="fas fa-print me-2"></i>Cetak Kad
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    // Config Firebase (Gunakan config anda yang sama)
    const firebaseConfig = {
        apiKey: "AIzaSyA03bLm1Ztt6TzF-jzOa9CpjZn7mEYtIlQ",
        databaseURL: "https://kehadiran-47efc-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "kehadiran-47efc",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    async function checkAndRegister() {
        const id = document.getElementById('stuID').value.trim();
        const name = document.getElementById('stuName').value.trim();
        const cls = document.getElementById('stuClass').value;

        if(!id || !name) return Swal.fire('Error', 'Sila isi ID dan Nama!', 'error');

        // 1. SEMAK JIKA ID DAH ADA
        const snap = await db.ref('pelajar/' + id).once('value');

        if(snap.exists()) {
            const data = snap.val();
            // Jika dah ada, tunjuk mesej dan papar QR sedia ada
            Swal.fire({
                title: 'Pelajar Sudah Terdaftar!',
                text: `ID ${id} telah didaftarkan sebelum ini atas nama ${data.name}.`,
                icon: 'warning',
                background: '#1e293b',
                color: '#fff'
            });
            showCard(data.name, id);
            document.getElementById('msgStatus').innerText = "PELAJAR SUDAH DIDAFTR SEBELUM INI";
        } else {
            // 2. JIKA TIADA, DAFTAR BARU
            db.ref('pelajar/' + id).set({
                name: name.toUpperCase(),
                class: cls
            }).then(() => {
                Swal.fire('Berjaya!', 'Pendaftaran pelajar baharu disimpan.', 'success');
                showCard(name.toUpperCase(), id);
                document.getElementById('msgStatus').innerText = "PENDAFTARAN BERJAYA!";
            });
        }
    }

    function showCard(name, id) {
        document.getElementById('displayArea').style.display = 'block';
        document.getElementById('displayName').innerText = name;
        document.getElementById('displayID').innerText = "ID: " + id;

        // Kosongkan QR lama jika ada
        document.getElementById('qr-result').innerHTML = "";
        
        // Jana QR baru berasaskan ID
        new QRCode(document.getElementById("qr-result"), {
            text: id,
            width: 150,
            height: 150,
            colorDark : "#000000",
            colorLight : "#ffffff",
        });
    }
</script>

<style>
    @media print {
        .no-print, .reg-card h3, .reg-card p, .mb-3, .mb-4, button { display: none !important; }
        body { background: white; }
        .reg-card { border: none; margin: 0; padding: 0; max-width: 100%; }
        #displayArea { display: block !important; margin-top: 0; color: black; }
        #qr-result { border: 2px solid #000; }
        #displayName, #displayID, #msgStatus { color: black !important; }
    }
</style>

</body>
</html>
