<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Pelajar | Attend-X Pro</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        * { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            padding: 20px;
        }
        .container-custom {
            max-width: 550px;
            margin: 0 auto;
        }
        .card-glass {
            background: rgba(255,255,255,0.95);
            border-radius: 28px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .btn-primary-custom {
            background: linear-gradient(95deg, #4f46e5, #7c3aed);
            border: none;
            border-radius: 40px;
            padding: 14px;
            font-weight: bold;
            color: white;
            width: 100%;
        }
        .btn-outline-custom {
            border: 2px solid #4f46e5;
            border-radius: 40px;
            padding: 12px;
            font-weight: bold;
            background: transparent;
            color: #4f46e5;
            width: 100%;
        }
        
        /* =============== KAD MATRIK =============== */
        .kad-matrik {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-width: 400px;
            margin: 0 auto;
        }
        .kad-header {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .kad-header h3 { margin: 0; font-size: 18px; font-weight: 600; }
        .kad-header p { margin: 5px 0 0; font-size: 11px; opacity: 0.8; }
        .school-logo { font-size: 40px; margin-bottom: 5px; }
        
        .kad-body { padding: 20px; background: white; }
        
        .avatar-circle {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .avatar-circle i { font-size: 45px; color: white; }
        
        .info-row {
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #e2e8f0;
        }
        .info-label { font-size: 11px; color: #64748b; text-transform: uppercase; margin-bottom: 2px; }
        .info-value { font-size: 16px; font-weight: 700; color: #1e293b; }
        
        .qr-area { text-align: center; margin: 15px 0; padding: 10px; background: #f8fafc; border-radius: 15px; }
        .qr-label { font-size: 10px; color: #64748b; margin-top: 5px; }
        
        .kad-footer {
            background: #f1f5f9;
            padding: 12px;
            text-align: center;
            border-top: 1px solid #e2e8f0;
        }
        .signature { font-family: 'Brush Script MT', cursive; font-size: 18px; color: #1e3c72; }
        .footer-text { font-size: 9px; color: #64748b; }
        .role-badge {
            display: inline-block;
            background: #e2e8f0;
            color: #1e3c72;
            font-size: 10px;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 600;
        }
        
        @media print {
            body * { visibility: hidden; }
            #kadToPrint, #kadToPrint * { visibility: visible; }
            #kadToPrint { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 20px; }
            .no-print { display: none !important; }
            .kad-matrik { box-shadow: none; border: 1px solid #ddd; }
        }
    </style>
</head>
<body>

<div class="container-custom">
    <div class="text-center mb-4">
        <h1 class="text-white fw-bold">🎓 PORTAL PELAJAR</h1>
        <p class="text-white-50">Daftar & Cetak Kad Matrik</p>
    </div>
    
    <div class="card-glass">
        <h3 class="text-center mb-3"><i class="fas fa-id-card text-primary"></i> Daftar Kad Matrik</h3>
        <p class="text-center text-muted small">Isi maklumat untuk terbitkan Kad Matrik</p>
        
        <label class="form-label">ID Pelajar (No KP / No Matrik)</label>
        <input type="text" id="studentID" class="form-control mb-3" placeholder="cth: M24001 / 050101020304">
        
        <label class="form-label">Nama Penuh</label>
        <input type="text" id="studentName" class="form-control mb-3" placeholder="NUR AISYAH BINTI ABDULLAH">
        
        <label class="form-label">Kelas / Tingkatan</label>
        <select id="studentClass" class="form-select mb-3">
            <option value="1 IBNU SINA">1 IBNU SINA</option>
            <option value="1 KARISMA">1 KARISMA</option>
            <option value="1 SIMFONI">1 SIMFONI</option>
            <option value="2 AL-FARABI">2 AL-FARABI</option>
            <option value="2 AL-BIRUNI">2 AL-BIRUNI</option>
            <option value="3 IMAM AL-GHAZALI">3 IMAM AL-GHAZALI</option>
        </select>
        
        <button onclick="registerStudent()" class="btn-primary-custom">
            <i class="fas fa-qrcode me-2"></i> DAFTAR & TERBITKAN KAD
        </button>
        
        <!-- Area Papar Kad -->
        <div id="kadArea" class="mt-4" style="display: none;">
            <hr>
            <div id="kadToPrint"></div>
            <div class="text-center mt-3 no-print">
                <button onclick="printCard()" class="btn-outline-custom" style="width: auto; padding: 10px 25px;">
                    <i class="fas fa-print me-2"></i> Cetak Kad
                </button>
                <button onclick="downloadCardAsImage()" class="btn-outline-custom mt-2" style="width: auto; padding: 10px 25px; background: #4f46e5; color: white; border: none;">
                    <i class="fas fa-download me-2"></i> Simpan Gambar
                </button>
            </div>
        </div>
    </div>
    
    <div class="card-glass mt-3 no-print">
        <div class="text-center">
            <i class="fas fa-info-circle text-info fa-2x mb-2"></i>
            <h5>Cara Guna Kad Matrik</h5>
            <p class="small text-muted">1. Daftar dan dapatkan Kad Matrik di atas<br>
            2. Cetak / simpan kad tersebut<br>
            3. Scan QR di depan pagar sekolah setiap kali hadir</p>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA03bLm1Ztt6TzF-jzOa9CpjZn7mEYtIlQ",
        databaseURL: "https://kehadiran-47efc-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "kehadiran-47efc",
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let currentStudent = { name: '', id: '', class: '' };
    
    function generateKadMatrik(name, id, className) {
        const kadHTML = `
            <div class="kad-matrik">
                <div class="kad-header">
                    <div class="school-logo"><i class="fas fa-graduation-cap"></i></div>
                    <h3>SMK PUTRA</h3>
                    <p>Kad Matrik Pelajar</p>
                </div>
                <div class="kad-body">
                    <div class="text-center">
                        <div class="avatar-circle"><i class="fas fa-user-graduate"></i></div>
                        <div class="role-badge">PELAJAR AKTIF</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label"><i class="fas fa-user"></i> NAMA PENUH</div>
                        <div class="info-value">${escapeHtml(name)}</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label"><i class="fas fa-id-card"></i> NO. MATRIK / ID</div>
                        <div class="info-value">${escapeHtml(id)}</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label"><i class="fas fa-chalkboard-user"></i> KELAS / TINGKATAN</div>
                        <div class="info-value">${escapeHtml(className)}</div>
                    </div>
                    <div class="qr-area">
                        <div id="qrKadMatrik"></div>
                        <div class="qr-label">Scan QR untuk kehadiran</div>
                    </div>
                </div>
                <div class="kad-footer">
                    <div class="signature">~ Digital Attendance System ~</div>
                    <div class="footer-text">Kad ini sah untuk kehadiran harian | Attend-X Pro</div>
                </div>
            </div>
        `;
        document.getElementById('kadToPrint').innerHTML = kadHTML;
        
        setTimeout(() => {
            const qrContainer = document.getElementById('qrKadMatrik');
            if (qrContainer) {
                qrContainer.innerHTML = '';
                new QRCode(qrContainer, { text: id, width: 120, height: 120, colorDark: "#1e3c72", colorLight: "#ffffff" });
            }
        }, 100);
    }
    
    function escapeHtml(text) { return text || ''; }
    
    async function registerStudent() {
        const id = document.getElementById('studentID').value.trim();
        const name = document.getElementById('studentName').value.trim();
        const cls = document.getElementById('studentClass').value;
        
        if (!id || !name) {
            Swal.fire('Error', 'Sila isi ID dan Nama lengkap', 'error');
            return;
        }
        
        const snap = await db.ref('pelajar/' + id).once('value');
        
        if (snap.exists()) {
            Swal.fire('Sudah Berdaftar', `Pelajar ${snap.val().name} sudah wujud`, 'info');
            generateKadMatrik(snap.val().name, id, snap.val().class);
            document.getElementById('kadArea').style.display = 'block';
        } else {
            await db.ref('pelajar/' + id).set({ name: name.toUpperCase(), class: cls, registeredAt: Date.now() });
            Swal.fire('Berjaya!', `Kad Matrik untuk ${name.toUpperCase()} telah diterbitkan`, 'success');
            generateKadMatrik(name.toUpperCase(), id, cls);
            document.getElementById('kadArea').style.display = 'block';
        }
        currentStudent = { name: name.toUpperCase(), id: id, class: cls };
    }
    
    function printCard() { window.print(); }
    
    async function downloadCardAsImage() {
        const element = document.getElementById('kadToPrint');
        if (!element) return;
        Swal.fire({ title: 'Memproses...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
        try {
            const canvas = await html2canvas(element, { scale: 2, backgroundColor: '#ffffff' });
            const link = document.createElement('a');
            link.download = `kad_matrik_${currentStudent.id}.png`;
            link.href = canvas.toDataURL();
            link.click();
            Swal.close();
            Swal.fire('Berjaya!', 'Gambar kad telah disimpan', 'success');
        } catch (error) {
            Swal.close();
            Swal.fire('Ralat', 'Gagal menjana gambar', 'error');
        }
    }
    
    window.registerStudent = registerStudent;
    window.printCard = printCard;
    window.downloadCardAsImage = downloadCardAsImage;
</script>
</body>
</html>
