<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attend-X Pro | Laporan Berkala</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root { --accent: #6366f1; --bg: #0f172a; }
        body { background: var(--bg); color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; }
        .card { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; }
        .btn-primary { background: var(--accent); border: none; }
        
        /* Input Design */
        .filter-box { background: #1e293b; color: white; border: 1px solid #334155; border-radius: 8px; padding: 5px 10px; }
        
        /* Print Optimization */
        @media print {
            .no-print { display: none !important; }
            body { background: white; color: black; padding: 0; }
            .card { border: 1px solid #ddd; color: black; background: white !important; box-shadow: none; }
            .table { color: black !important; }
            .badge { border: 1px solid #000; color: black !important; background: transparent !important; }
        }
    </style>
</head>
<body>

    <div class="container py-4">
        <div class="row mb-4 align-items-end g-3 no-print">
            <div class="col-md-4">
                <h3 class="fw-bold text-info m-0">ATTEND-X <span class="text-white">REPORTS</span></h3>
                <p class="text-muted small">Pilih julat tarikh untuk Jana Laporan</p>
            </div>
            <div class="col-md-3">
                <label class="small text-muted">Tarikh Mula:</label>
                <input type="date" id="startDate" class="form-control filter-box">
            </div>
            <div class="col-md-3">
                <label class="small text-muted">Tarikh Tamat:</label>
                <input type="date" id="endDate" class="form-control filter-box">
            </div>
            <div class="col-md-2">
                <button onclick="generateReport()" class="btn btn-primary w-100 fw-bold">
                    <i class="fas fa-sync me-2"></i>JANA
                </button>
            </div>
        </div>

        <div class="d-flex justify-content-end mb-3 no-print">
             <button onclick="window.print()" class="btn btn-outline-light btn-sm rounded-pill">
                <i class="fas fa-print me-2"></i>Cetak Laporan Ini
            </button>
        </div>

        <div id="reportPaper" class="card p-4 shadow-lg">
            <div class="text-center mb-4">
                <h4 class="fw-bold text-uppercase">Laporan Analisis Kehadiran Murid</h4>
                <p class="mb-0" id="printDateRange">Sila jana laporan...</p>
                <hr style="border-top: 2px solid #6366f1; opacity: 1;">
            </div>

            <div class="row text-center mb-4 g-2">
                <div class="col-4">
                    <div class="p-2 border rounded">
                        <small class="d-block text-muted">Purata Hadir</small>
                        <h4 class="fw-bold text-success" id="sumHadir">0%</h4>
                    </div>
                </div>
                <div class="col-4">
                    <div class="p-2 border rounded">
                        <small class="d-block text-muted">Purata Lewat</small>
                        <h4 class="fw-bold text-warning" id="sumLewat">0%</h4>
                    </div>
                </div>
                <div class="col-4">
                    <div class="p-2 border rounded">
                        <small class="d-block text-muted">Purata Ponteng</small>
                        <h4 class="fw-bold text-danger" id="sumPonteng">0%</h4>
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle" id="mainTable">
                    <thead class="table-dark">
                        <tr>
                            <th>Nama Murid</th>
                            <th>Kelas</th>
                            <th class="text-center">Bil. Hari Hadir</th>
                            <th class="text-center">Bil. Hari Lewat</th>
                            <th class="text-center">% Kehadiran</th>
                        </tr>
                    </thead>
                    <tbody id="reportTableBody">
                        <tr><td colspan="5" class="text-center text-muted py-5">Klik "JANA" untuk memulakan pengiraan data.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 1. Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA03bLm1Ztt6TzF-jzOa9CpjZn7mEYtIlQ",
            authDomain: "kehadiran-47efc.firebaseapp.com",
            projectId: "kehadiran-47efc",
            databaseURL: "https://kehadiran-47efc-default-rtdb.asia-southeast1.firebasedatabase.app",
            storageBucket: "kehadiran-47efc.firebasestorage.app",
            appId: "1:523088126436:web:6fb51d9888bcd18f7267f1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Auto-set date to today
        document.getElementById('startDate').valueAsDate = new Date();
        document.getElementById('endDate').valueAsDate = new Date();

        async function generateReport() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            
            if(!start || !end) return Swal.fire('Ops!', 'Sila pilih julat tarikh.', 'warning');

            Swal.fire({ title: 'Menjana Laporan...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            document.getElementById('printDateRange').innerText = `Tempoh: ${start} hingga ${end}`;

            // 1. Dapatkan senarai pelajar
            const studentsSnap = await db.ref('pelajar').once('value');
            const allStudents = studentsSnap.val() || {};
            
            // 2. Dapatkan senarai tarikh (julat)
            let dateList = [];
            let dt = new Date(start);
            while (dt <= new Date(end)) {
                dateList.push(new Date(dt).toISOString().split('T')[0]);
                dt.setDate(dt.getDate() + 1);
            }

            // 3. Tarik data kehadiran untuk SEMUA tarikh dalam julat
            let reportData = {}; // { studentID: { hadir: 0, lewat: 0 } }
            
            for(let date of dateList) {
                const daySnap = await db.ref(`kehadiran/${date}`).once('value');
                const dayData = daySnap.val() || {};

                Object.keys(allStudents).forEach(id => {
                    if(!reportData[id]) reportData[id] = { onTime: 0, late: 0 };
                    
                    if(dayData[id]) {
                        if(dayData[id].status === "HADIR") reportData[id].onTime++;
                        else if(dayData[id].status === "LEWAT") reportData[id].late++;
                    }
                });
            }

            // 4. Render Table
            let html = "";
            let totalHadirRate = 0;
            let totalLateRate = 0;
            const totalDays = dateList.length;
            const studentCount = Object.keys(allStudents).length;

            Object.keys(allStudents).forEach(id => {
                const s = allStudents[id];
                const d = reportData[id];
                const totalPresent = d.onTime + d.late;
                const percentage = ((totalPresent / totalDays) * 100).toFixed(1);

                totalHadirRate += (d.onTime / totalDays);
                totalLateRate += (d.late / totalDays);

                html += `<tr>
                    <td class="fw-bold">${s.name}</td>
                    <td>${s.class}</td>
                    <td class="text-center text-success fw-bold">${d.onTime} Hari</td>
                    <td class="text-center text-warning fw-bold">${d.late} Hari</td>
                    <td class="text-center">
                        <span class="badge ${percentage > 80 ? 'bg-success' : 'bg-danger'} p-2 w-100">
                            ${percentage}%
                        </span>
                    </td>
                </tr>`;
            });

            document.getElementById('reportTableBody').innerHTML = html;

            // 5. Update Summary
            const avgHadir = ((totalHadirRate / studentCount) * 100).toFixed(0);
            const avgLate = ((totalLateRate / studentCount) * 100).toFixed(0);
            const avgAbsent = (100 - avgHadir - avgLate);

            document.getElementById('sumHadir').innerText = avgHadir + "%";
            document.getElementById('sumLewat').innerText = avgLate + "%";
            document.getElementById('sumPonteng').innerText = avgAbsent + "%";

            Swal.close();
        }
    </script>
</body>
</html>
